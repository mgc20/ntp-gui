<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ntp-gui</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%234493f8' stroke-width='2'/%3E%3Cpath d='M12 7v5l3.5 2' fill='none' stroke='%234493f8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 6.75V12l3.5 2.25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <h1 id="title">ntp-gui</h1>
        <p class="subtitle"><span id="hostname"></span> · <span id="clock"></span></p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="sync-pill" data-state="unknown" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="sync-label">verbinde …</span>
      </span>
      <button type="button" id="theme-toggle" class="icon-button" title="Hell / Dunkel" aria-label="Hell oder dunkel umschalten">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <nav id="nav" class="nav" aria-label="Bereiche"></nav>
  <div id="reload-banner" class="reload-banner" hidden role="status" aria-live="polite"></div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="footer">
  <span id="footer-note"></span>
  <span class="footer-links"><a href="/metrics">/metrics</a> · <a href="/api/status">/api/status</a> · <a href="/healthz">/healthz</a></span>
</footer>
</body>
</html>
