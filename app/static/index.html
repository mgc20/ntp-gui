<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ntp-gui</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%234493f8' stroke-width='2'/%3E%3Cpath d='M12 7v5l3.5 2' fill='none' stroke='%234493f8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="app.skip_link">Zum Inhalt springen</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 6.75V12l3.5 2.25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <h1 id="title-wrap"><span id="title" class="title-long">ntp-gui</span><span class="title-short" data-i18n="app.title_short">NTP-GUI</span></h1>
        <p class="subtitle"><span id="hostname"></span> · <span id="clock"></span></p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="sync-pill" data-state="unknown" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="sync-label" data-i18n="app.connecting">verbinde …</span>
      </span>
      <a class="icon-button" id="clock-link" href="/clock" title="Vollbild-Uhr (Wandmonitor, Tablet)" aria-label="Vollbild-Uhr öffnen" data-i18n-title="app.clock_link_title" data-i18n-aria-label="app.clock_link_label">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8.5V12l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button type="button" id="lang-toggle" class="icon-button lang-toggle" title="Sprache: Deutsch / English (Beta)" aria-label="Sprache wechseln (Language)" data-i18n-title="app.language_title" data-i18n-aria-label="app.language_label"><span id="lang-code" aria-hidden="true">DE</span></button>
      <button type="button" id="theme-toggle" class="icon-button" title="Hell / Dunkel" aria-label="Hell oder dunkel umschalten" data-i18n-title="app.theme_title" data-i18n-aria-label="app.theme_label">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <nav id="nav" class="nav" aria-label="Bereiche" data-i18n-aria-label="nav.label"></nav>
  <div id="reload-banner" class="reload-banner" hidden role="status" aria-live="polite"></div>
  <!-- Verbindungsverlust: Inhalt bleibt stehen, hier steht, seit wann er veraltet ist (app.js showStale). -->
  <div id="stale-banner" class="reload-banner" data-state="error" hidden role="status" aria-live="polite"></div>
</header>
<!-- Außerhalb der klebenden Kopfzeile: scrollt mit weg und frisst auf dem Handy keinen Platz. -->
<div id="update-banner" class="update-banner" hidden></div>

<!-- Reiterleiste der Gruppen „Uhr & Hardware“ und „System“ (app.js renderTabs). -->
<nav id="tabs" class="tabs" hidden></nav>
<main id="main" tabindex="-1"></main>

<footer class="footer">
  <span id="footer-note"></span>
  <button type="button" id="shortcuts-button" class="link footer-button" data-i18n="app.shortcuts.hint">Tastenkürzel (?)</button>
</footer>
<!-- Handy (≤ 640 px): untere Leiste mit „Mehr“ (app.js buildBottomBar). -->
<nav id="bottombar" class="bottombar" aria-label="Hauptbereiche" data-i18n-aria-label="app.bottom_label"></nav>
</body>
</html>
