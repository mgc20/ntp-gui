name: Release

# Per Knopfdruck veröffentlichen: Actions → Release → "Run workflow".
# Reihenfolge mit Absicht: erst alles testen und prüfen, dann das Image nur per Digest
# hochladen (noch ohne Tag), dann Herkunftsnachweis, erst danach Image-Tags, Git-Tag und
# GitHub-Release. Scheitert ein Schritt, bleibt kein halber Release (Tag ohne Image, „latest“
# auf einem ungeprüften Image) zurück – höchstens ein unbenannter Digest in der Registry.
#
# Lieferkette (ab 1.4):
#   * Release-Builds ohne Build-Cache (no-cache): jeder Release zieht die aktuellen
#     Debian-Pakete, auch wenn sich das Basis-Image nicht geändert hat.
#   * SBOM (SPDX-JSON, syft) und Schwachstellen-Scan (Grype) laufen gegen den hochgeladenen
#     Digest – getrennt für linux/amd64 und linux/arm64, also genau gegen das, was ausgeliefert
#     und nachgewiesen wird. Beide SBOMs und Berichte hängen am GitHub-Release.
#   * Regel des Scans: Der Release bricht nur ab, wenn eine Architektur eine KRITISCHE Lücke
#     enthält, für die es schon eine Korrektur gibt (Debian hat ein gepatchtes Paket). Abhilfe:
#     Release einfach neu starten (baut ohne Cache mit den aktuellen Paketen) – reicht das
#     nicht, steckt die Lücke im Basis-Image: den Dependabot-PR für den neuen Digest von
#     debian:trixie-slim mergen. Lücken ohne Korrektur („unfixed“ in Debian) und alles
#     unterhalb von kritisch stehen nur im Bericht – sonst ließe sich praktisch nie ein
#     Release bauen.
#   * Herkunftsnachweis (SLSA Build Provenance) per actions/attest-build-provenance für den
#     Digest des veröffentlichten Images, in der Registry abgelegt und direkt danach mit
#     „gh attestation verify“ geprüft. Das OIDC-Token (id-token: write) bekommt nur der
#     kleine Job „attest“, in dem außer dieser einen Action keine fremde läuft.
#   * Alle Actions (auch actions/* und docker/*) sind auf Commit-SHAs festgenagelt, die
#     Version steht als Kommentar dahinter; Dependabot (.github/dependabot.yml) schlägt
#     Updates wöchentlich vor und hebt SHA und Kommentar gemeinsam an.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne führendes v, z. B. 1.0.0"
        required: true
        default: "1.0.0"

# Rechte je Job (unten); global nichts.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Testen, bauen, prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # Image per Digest nach ghcr.io laden
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Release nur von main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release bitte von main starten (aktuell: ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version prüfen
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' ist kein SemVer (erwartet z. B. 1.0.0)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} existiert bereits"
            exit 1
          fi
          echo "Release v${VERSION} von $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Unittests
        run: python3 -m unittest discover -s tests -v

      - name: Entrypoint-Syntax prüfen
        run: bash -n docker/entrypoint.sh

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image für den Integrationstest bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          no-cache: true
          tags: ntp-gui:release-test

      - name: Integrationstest
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends chrony || true
          ./tests/container-test.sh ntp-gui:release-test

      - name: In die GitHub Container Registry einloggen
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Namen klein schreiben
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Metadaten (Labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}

      # Nur per Digest, noch ohne Tag: „latest“ und die Versionstags kommen erst im Job „publish“,
      # wenn Scan und Herkunftsnachweis durch sind.
      - name: Image bauen und per Digest hochladen (amd64 + arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      # --- Lieferkette: SBOM und Schwachstellen am hochgeladenen Digest, je Architektur ------
      - name: syft bereitstellen
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Grype bereitstellen
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: SBOM und Schwachstellen-Bericht (je Architektur)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
          REF: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          {
            echo "## Schwachstellen im Image (Grype)"
            echo
            echo "Geprüft: \`${REF}\` – Regel: Abbruch nur bei kritischen Lücken mit verfügbarer Korrektur."
          } >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            "$SYFT" scan "registry:${REF}" --platform "linux/${arch}" \
              -o "spdx-json=release-assets/ntp-gui-${VERSION}-${arch}.spdx.json"
            # Grype liest das Image selbst (nicht die SPDX-Datei): nur so kennt es die Debian-Version.
            "$GRYPE" "registry:${REF}" --platform "linux/${arch}" -o table \
              > "release-assets/ntp-gui-${VERSION}-${arch}-vulnerabilities.txt"
            {
              echo
              echo "### linux/${arch}"
              echo
              echo '```'
              head -n 300 "release-assets/ntp-gui-${VERSION}-${arch}-vulnerabilities.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Schwachstellen-Sperre (kritisch und behebbar, je Architektur)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          REF: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "== linux/${arch}"
            "$GRYPE" "registry:${REF}" --platform "linux/${arch}" --only-fixed --fail-on critical -o table
          done

      - name: SBOM und Berichte für den Release ablegen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Herkunftsnachweis
    needs: build
    # GitHub speichert Herkunftsnachweise nur für öffentliche Repositories (bei privaten
    # Repositories eines Nutzers: „Feature not available“). Privat: Schritt überspringen, der
    # Release läuft ohne Nachweis weiter – SBOM und Scan gibt es trotzdem.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    # Nur hier gibt es das OIDC-Token – und hier läuft keine andere fremde Action.
    permissions:
      contents: read
      packages: write      # Nachweis in der Registry ablegen
      id-token: write      # OIDC-Token für die Signatur (Sigstore)
      attestations: write  # Nachweis speichern
    steps:
      # push-to-registry braucht ein Registry-Login in diesem Job. Per Shell statt mit
      # docker/login-action, damit hier außer attest-build-provenance keine fremde Action läuft.
      - name: In die GitHub Container Registry einloggen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Herkunftsnachweis (Build Provenance) anlegen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Herkunftsnachweis prüfen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" -R "${GITHUB_REPOSITORY}"

  publish:
    name: Tags und GitHub-Release
    needs: [build, attest]
    # Nur nach erfolgreichem Bau; der Nachweis muss geklappt haben oder (privates Repo) übersprungen sein.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Tag und Release anlegen
      packages: write      # Image-Tags setzen
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      ATTESTED: ${{ needs.attest.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: SBOM und Berichte holen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Image-Tags setzen (gleicher Digest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION%.*}" -t "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"
          # Ein Tag auf dieselbe Quelle ändert den Digest nicht – der Nachweis gilt weiter.
          for tag in "${VERSION}" "${VERSION%.*}" latest; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [[ "$got" != "$DIGEST" ]]; then
              echo "::error::${IMAGE}:${tag} zeigt auf ${got}, erwartet ${DIGEST}"
              exit 1
            fi
          done

      - name: Tag anlegen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "ntp-gui ${VERSION}"
          git push origin "v${VERSION}"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## Container-Image"
            echo
            echo "Für linux/amd64 und linux/arm64 (Raspberry Pi):"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${VERSION%.*}"
            echo "${IMAGE}:latest"
            echo '```'
            echo
            echo "Schnellstart:"
            echo
            echo '```bash'
            echo "docker run -d -p 123:123/udp -p 8080:8080 --cap-add SYS_TIME ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "## Herkunft prüfen"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            if [ "${ATTESTED}" = "success" ]; then
              echo '```bash'
              echo "gh attestation verify oci://${IMAGE}:${VERSION} -R ${GITHUB_REPOSITORY}"
              echo '```'
            else
              echo "Ohne Herkunftsnachweis: GitHub bietet ihn nur für öffentliche Repositories an."
            fi
            echo
            echo "Am Release je Architektur (amd64, arm64) eine SBOM (\`ntp-gui-${VERSION}-<arch>.spdx.json\`)"
            echo "und der Schwachstellen-Bericht von Grype (\`ntp-gui-${VERSION}-<arch>-vulnerabilities.txt\`) –"
            echo "beide aus genau diesem Digest erzeugt. Der Release bricht nur bei kritischen Lücken mit"
            echo "verfügbarer Korrektur ab; offene Debian-Lücken ohne Korrektur stehen nur im Bericht."
          } > release-notes.md
          gh release create "v${VERSION}" --title "ntp-gui ${VERSION}" \
            --notes-file release-notes.md --generate-notes \
            release-assets/*
