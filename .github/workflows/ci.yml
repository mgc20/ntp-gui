name: CI

on:
  push:
    # Nur main: Branches mit offenem PR liefen sonst doppelt (push + pull_request) und
    # verbrauchten die doppelten Actions-Minuten.
    branches: ["main"]
    # Keine Tags: Veröffentlicht wird nur über release.yml. Ein Tag-Push (z. B. beim Umzug in ein
    # neues Repository mit allen alten Tags) baute sonst jede alte Version und setzte „latest“ –
    # wer zuletzt fertig wurde, gewann.
  pull_request:
  workflow_dispatch:

concurrency:
  # Ein neuer Push bricht den alten Lauf desselben Branches/PRs ab.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Parser-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Unittests
        run: python3 -m unittest discover -s tests -v
      - name: Entrypoint-Syntax prüfen
        run: bash -n docker/entrypoint.sh

  build:
    name: Image bauen
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # Nur bauen und testen (Smoke-Test) – nie veröffentlichen.
      - name: Bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Integrationstest gegen das Image
        run: |
          set -euo pipefail
          # chrony auf dem Runner erlaubt eine echte NTP-Abfrage gegen den Container.
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends chrony || true
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          ./tests/container-test.sh "$IMAGE"
