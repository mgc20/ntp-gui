name: CI

on:
  push:
    # Nur main: Branches mit offenem PR liefen sonst doppelt (push + pull_request) und
    # verbrauchten die doppelten Actions-Minuten.
    branches: ["main"]
    # Keine Tags: Veröffentlicht wird nur über release.yml. Ein Tag-Push (z. B. beim Umzug in ein
    # neues Repository mit allen alten Tags) baute sonst jede alte Version und setzte „latest“ –
    # wer zuletzt fertig wurde, gewann.
  pull_request:
  workflow_dispatch:

concurrency:
  # Ein neuer Push bricht den alten Lauf desselben Branches/PRs ab.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Parser-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Unittests
        run: python3 -m unittest discover -s tests -v
      - name: Entrypoint-Syntax prüfen
        run: bash -n docker/entrypoint.sh

  datenschutz:
    name: Datenschutz-Wächter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # für die Commits des PR
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Dateien immer; im PR zusätzlich alle neuen Commits (Autor, Committer, Nachricht) sowie
      # Titel und Beschreibung. PR-Texte gehen nur über Umgebungsvariablen in das Skript.
      - name: Dateien, Commits und PR-Text prüfen
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$BASE" ]; then
            python3 .github/scripts/datenschutz_waechter.py --commits "$BASE..$HEAD_SHA" --pr-text
          else
            python3 .github/scripts/datenschutz_waechter.py
          fi

  build:
    name: Image bauen
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # Nur bauen und testen (Smoke-Test) – nie veröffentlichen.
      - name: Bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Integrationstest gegen das Image
        run: |
          set -euo pipefail
          # chrony auf dem Runner erlaubt eine echte NTP-Abfrage gegen den Container.
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends chrony || true
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          ./tests/container-test.sh "$IMAGE"
