name: CI

on:
  push:
    # Nur main: Branches mit offenem PR liefen sonst doppelt (push + pull_request) und
    # verbrauchten die doppelten Actions-Minuten.
    branches: ["main"]
    # Keine Tags: Veröffentlicht wird nur über release.yml. Ein Tag-Push (z. B. beim Umzug in ein
    # neues Repository mit allen alten Tags) baute sonst jede alte Version und setzte „latest“ –
    # wer zuletzt fertig wurde, gewann.
  pull_request:
  workflow_dispatch:

concurrency:
  # Ein neuer Push bricht den alten Lauf desselben Branches/PRs ab.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Parser-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Unittests
        run: python3 -m unittest discover -s tests -v
      - name: Entrypoint-Syntax prüfen
        run: bash -n docker/entrypoint.sh

  datenschutz:
    name: Datenschutz-Wächter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # für die Commits des PR
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Dateien immer; im PR zusätzlich alle neuen Commits (Autor, Committer, Nachricht) sowie
      # Titel und Beschreibung. PR-Texte gehen nur über Umgebungsvariablen in das Skript.
      - name: Dateien, Commits und PR-Text prüfen
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$BASE" ]; then
            python3 .github/scripts/datenschutz_waechter.py --commits "$BASE..$HEAD_SHA" --pr-text
          else
            python3 .github/scripts/datenschutz_waechter.py
          fi

  build:
    name: Image bauen
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # Nur bauen und testen (Smoke-Test) – nie veröffentlichen.
      - name: Bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Integrationstest gegen das Image
        run: |
          set -euo pipefail
          # chrony auf dem Runner erlaubt eine echte NTP-Abfrage gegen den Container.
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends chrony || true
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          ./tests/container-test.sh "$IMAGE"

  # Oberfläche im echten Browser: tests/ui/ci.sh (Auswahl aus dem Rundgang tests/ui/rundgang.sh gegen den
  # Server mit erfundenem chronyc) und die Unittests, die Playwright oder ptp4l brauchen – hier Pflicht,
  # ohne Browser oder ptp4l scheitern sie statt still übersprungen zu werden. Keine Geheimnisse, kein Netz
  # außer den Paketquellen (npm, Ubuntu-Archiv, Browser-Download von Playwright).
  ui:
    name: Oberfläche (Rundgang)
    runs-on: ubuntu-latest
    # Über der Summe der Schritt-Grenzen (10 + 10 + 40) samt Checkout: Zuerst greift eine Schritt-Grenze,
    # der Job gilt dann als fehlgeschlagen und der Befund wird hochgeladen.
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      # Feste Version; lokal mit derselben geprüft. Beim Anheben README in tests/ui mitziehen.
      PLAYWRIGHT_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Playwright, Chromium und ptp4l installieren
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'
          PW="$RUNNER_TEMP/playwright"
          mkdir -p "$PW"
          npm install --prefix "$PW" --no-save --no-audit --no-fund --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$PW/node_modules" >> "$GITHUB_ENV"
          "$PW/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends linuxptp
      - name: Unittests mit Browser und ptp4l
        timeout-minutes: 10
        env:
          NTPGUI_WERKZEUGE_PFLICHT: "1"
        working-directory: tests
        run: python3 -m unittest -v test_darstellung_browser test_live_eingaben test_ptp_gm
      - name: Rundgang
        timeout-minutes: 40
        env:
          # Höchstdauer je Variante (s); eine hängende Variante beendet nicht den ganzen Schritt.
          TOUR_CI_LIMIT: "900"
        run: tests/ui/ci.sh 18300 "$RUNNER_TEMP/rundgang"
      - name: Befund hochladen
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rundgang-befund
          path: ${{ runner.temp }}/rundgang
          retention-days: 7
          if-no-files-found: ignore
