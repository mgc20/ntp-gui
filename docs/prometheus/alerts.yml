# Alarmregeln für ntp-gui (Prometheus / Alertmanager, auch für Grafana-Alerting importierbar).
#
# Einbinden in prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/ntp-gui-alerts.yml
#
# Scrape-Job (/metrics braucht bei gesetztem Passwort einen API-Schlüssel mit Recht „read“):
#   scrape_configs:
#     - job_name: ntp-gui
#       metrics_path: /metrics
#       authorization:
#         credentials_file: /etc/prometheus/ntp-gui.key   # Inhalt: ntpg_…
#       static_configs:
#         - targets: ["zeitserver.lan:8080"]
#
# Schwellen sind Vorschläge für ein Heimnetz mit GPS bzw. guten NTP-Quellen. Wer nur über das
# Internet synchronisiert, setzt die Offset-Schwelle eher auf 50 ms. Jede Metrik hier steht im
# Output von /metrics (geprüft von tests/test_integrations.py).

groups:
  - name: ntp-gui
    rules:
      - alert: NtpGuiChronyDown
        expr: ntpgui_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "chronyd antwortet nicht ({{ $labels.instance }})"
          description: "Das Dashboard läuft, aber chronyd gibt keine Auskunft. Ohne chronyd verteilt der Server keine Zeit. Container-Log prüfen."

      - alert: NtpGuiUnsynchronised
        expr: ntpgui_synchronised == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Zeitserver nicht synchron ({{ $labels.instance }})"
          description: "chrony ist seit 10 Minuten mit keiner Quelle synchron (oder läuft im Inselbetrieb). Clients bekommen ungeprüfte Zeit oder gar keine Antwort."

      - alert: NtpGuiNoSources
        expr: ntpgui_sources_usable == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Keine nutzbare Zeitquelle ({{ $labels.instance }})"
          description: "chrony nutzt seit 10 Minuten keine Quelle (alle unerreichbar, Falseticker oder zu unruhig). Seite „Quellen“ zeigt den Grund je Quelle."

      - alert: NtpGuiOffsetHigh
        # 10 ms: für GPS/PPS oder gute LAN-Quellen schon viel. Nur über Internet-NTP: 0.05 nehmen.
        expr: abs(ntpgui_system_time_offset_seconds) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Systemuhr weicht um {{ $value | humanizeDuration }} ab ({{ $labels.instance }})"
          description: "Die Abweichung der Systemuhr liegt seit 15 Minuten über 10 ms. Häufige Ursachen: Quelle gewechselt, GPS ohne PPS, Netz mit asymmetrischer Laufzeit."

      - alert: NtpGuiMaxErrorHigh
        expr: ntpgui_max_error_seconds > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fehlerschranke über 100 ms ({{ $labels.instance }})"
          description: "|Offset| + Root Dispersion + Root Delay/2 liegt über 100 ms – die Zeit dieses Servers ist nur noch grob verlässlich."

      - alert: NtpGuiGpsFixLost
        expr: ntpgui_gps_fix_mode < 2 or ntpgui_gps_running == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPS ohne Fix seit mehr als 10 Minuten ({{ $labels.instance }})"
          description: "Der GPS-Empfänger liefert keinen 2D/3D-Fix (oder gpsd antwortet nicht). chrony greift auf andere Quellen zurück, falls vorhanden. Antenne und Sicht zum Himmel prüfen."

      - alert: NtpGuiPpsLost
        expr: ntpgui_pps_live == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Keine PPS-Pulse auf {{ $labels.device }} ({{ $labels.instance }})"
          description: "Am PPS-Gerät kommen seit 10 Minuten keine Pulse an. Ohne PPS ist GPS-Zeit nur auf Millisekunden genau."

      - alert: NtpGuiServiceDown
        # Nur eingeschaltete Dienste: GPS/PTP aus oder DNS-Modus „system“ heißt „stopped“ mit Absicht.
        expr: ntpgui_service_up == 0 and on(instance, job, service) ntpgui_service_enabled == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dienst {{ $labels.service }} läuft nicht ({{ $labels.instance }})"
          description: "Der Supervisor meldet {{ $labels.service }} seit 10 Minuten als nicht laufend, obwohl er laut Einstellungen laufen soll. Seite „Hardware“ und Container-Log prüfen."

      - alert: NtpGuiNtsCertExpiring
        expr: ntpgui_nts_server_cert_days_left < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NTS-Zertifikat läuft in {{ $value | printf \"%.0f\" }} Tagen ab ({{ $labels.instance }})"
          description: "Nach Ablauf lehnen NTS-Clients den Schlüsselaustausch ab. Neues Zertifikat nach /config legen – ntp-gui bemerkt die Datei von selbst."

      - alert: NtpGuiNtsCertExpired
        expr: ntpgui_nts_server_cert_days_left < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NTS-Zertifikat abgelaufen ({{ $labels.instance }})"
          description: "NTS-Clients bekommen keine abgesicherte Zeit mehr."

      - alert: NtpGuiLeapListExpiring
        expr: ntpgui_leapseconds_list_days_left < 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Schaltsekunden-Liste läuft in {{ $value | printf \"%.0f\" }} Tagen ab ({{ $labels.instance }})"
          description: "Die leap-seconds.list im Image ist bald veraltet. Ein aktuelles ntp-gui-Image bringt eine neue Liste mit (tzdata)."

      - alert: NtpGuiUpdateAvailable
        expr: ntpgui_update_available == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Neue ntp-gui-Version verfügbar ({{ $labels.instance }})"
          description: "Nur mit eingeschaltetem Update-Hinweis. Release-Notizen lesen, dann Image ziehen und Container neu erstellen."

      - alert: NtpGuiSourceLoop
        expr: ntpgui_source_loops > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Zeitquelle zeigt auf ntp-gui selbst ({{ $labels.instance }})"
          description: "DNS-Umschreibung oder NAT-Umleitung ohne Ausnahme für ntp-gui – chronyd fragt sich selbst. Die Übersicht nennt Quelle und Abhilfe."

      - alert: NtpGuiGnssDisturbance
        expr: ntpgui_gnss_stage >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GNSS-Störung erkannt ({{ $labels.instance }})"
          description: "GPS-Zeit oder -Position weicht stark ab (Spoofing/Jamming möglich). Befunde auf der GPS-Seite; mit GNSS_GUARD=lock wird das GPS automatisch abgewählt."

      # --- Betrieb (ab 1.11): Clients, Alarmweg, Sicherung, Holdover, GPS-Automatik, Zeitwächter ---

      - alert: NtpGuiClientsOffAlarm
        # Offene Alarme der Client-Schwelle (Einstellungen → Clients) bzw. eigener Regeln je Gerät.
        expr: ntpgui_clients_offset_alarm > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} Client-Uhr(en) außer Toleranz ({{ $labels.instance }})"
          description: "Geräte im Netz gehen falsch, obwohl sie diesen Zeitserver fragen. Welche, zeigt die Seite „Clients“ – /metrics nennt bewusst keine Adressen."

      - alert: NtpGuiClientGroupSilent
        # Gruppe mit Geräten, von denen seit 24 h keines mehr gefragt hat (Umleitung/DHCP-Option 42 weg?).
        # Wie auf der Clients-Seite erst, wenn ntp-gui selbst seit 24 h ohne Pause mithört (nach einem
        # Neustart sind alle gespeicherten „zuletzt gesehen“ alt), und nie für „ohne Gruppe“.
        expr: (ntpgui_client_group_devices{group_id!="none"} > 0 and ntpgui_client_group_active{group_id!="none"} == 0) and on(instance, job) ntpgui_clients_listening_seconds > 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Client-Gruppe {{ $labels.group_id }} {{ $labels.group }} fragt nicht mehr ({{ $labels.instance }})"
          description: "Kein Gerät dieser Gruppe hat in den letzten 24 h nach der Zeit gefragt. Häufig fehlt die Umleitung oder die DHCP-Option 42 – siehe „Zeitserver erzwingen“."

      - alert: NtpGuiNotifyFailing
        # Alarmweg kaputt: ein eingeschalteter Kanal stellt nicht mehr zu.
        expr: ntpgui_notify_channels_failing > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Benachrichtigungskanal ({{ $labels.type }}) stellt nicht zu ({{ $labels.instance }})"
          description: "Der letzte Zustellversuch mindestens eines eingeschalteten Kanals dieser Art schlug fehl. Fehlertext und „Test senden“ auf der Seite „Benachrichtigungen“."

      - alert: NtpGuiNotifyQueueStuck
        expr: ntpgui_notify_queue > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Benachrichtigungen warten seit 1 h ({{ $labels.type }}, {{ $labels.instance }})"
          description: "Meldungen hängen in der Warteschlange (Wiederholungen nach Fehlern). Ziel erreichbar?"

      - alert: NtpGuiNightlyBackupOld
        # Nur mit eingeschalteter nächtlicher Sicherung; 36 h = eine Nacht ausgefallen.
        expr: ntpgui_backup_nightly_age_seconds > 36 * 3600 or ntpgui_backup_nightly_failed == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Nächtliche Sicherung alt oder fehlgeschlagen ({{ $labels.instance }})"
          description: "Die jüngste nächtliche Sicherung ist älter als 36 h, oder der letzte Versuch schlug fehl. Container-Log ([backup]) und freien Platz im Datenverzeichnis prüfen."

      - alert: NtpGuiNightlyBackupMissing
        # Eingeschaltet, aber noch keine Sicherung: Die erste entsteht erst gegen 3 Uhr Ortszeit des
        # Servers – deshalb erst nach 26 h ohne Sicherung melden (eingeschaltet um 3:01 → erste nach ~24 h).
        expr: ntpgui_backup_nightly_enabled == 1 unless on(instance, job) ntpgui_backup_nightly_age_seconds
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "Nächtliche Sicherung fehlt ({{ $labels.instance }})"
          description: "Die nächtliche Sicherung ist seit über 26 h eingeschaltet, es gibt aber noch keine. Container-Log ([backup]) und freien Platz im Datenverzeichnis prüfen."

      - alert: NtpGuiCritEvents
        expr: increase(ntpgui_events_total{level="crit"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Kritisches Ereignis ({{ $labels.kind }}) im Protokoll ({{ $labels.instance }})"
          description: "Im Ereignisprotokoll steht ein neuer Eintrag der Stufe „kritisch“. Details auf der Seite „Ereignisse“."

      - alert: NtpGuiHoldoverTestFailed
        # Der letzte Holdover-Test endete an der Grenze oder war ungültig – nur 24 h lang nach dem Testende,
        # damit ein altes Ergebnis nicht dauerhaft als Alarm stehen bleibt.
        expr: ntpgui_holdover_last_result{outcome=~"limit|invalid"} == 1 and on(instance, job) (time() - ntpgui_holdover_last_end_timestamp_seconds) < 86400
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Letzter Holdover-Test: {{ $labels.outcome }} ({{ $labels.instance }})"
          description: "Die Uhr hielt die Grenze ohne Quellen nicht bzw. der Test war ungültig. Ergebnis und Verlauf auf der Seite „Uhrqualität“."

      - alert: NtpGuiGpsAutocalNeedsLook
        expr: ntpgui_gps_autocal_phase{phase=~"check|hold"} == 1
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "GPS-Automatik: {{ $labels.phase }} ({{ $labels.instance }})"
          description: "Die automatische GPS-Kalibrierung ändert nichts, weil die Messung ungewöhnlich ist (check) oder eine GNSS-Störung sie sperrt (hold). GPS-Seite, Karte „Kalibrierung“."

      - alert: NtpGuiHeartbeatFailing
        expr: ntpgui_heartbeat_consecutive_failures >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Zeitwächter-Ping erreicht den Wächter nicht ({{ $labels.instance }})"
          description: "Drei oder mehr Pings in Folge schlugen fehl – der eigene Wächter meldet den Server bald als ausgefallen. Adresse und Erreichbarkeit unter „Benachrichtigungen“ prüfen."
