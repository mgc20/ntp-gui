<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Wie ein Client den Zeitserver findet</title><desc id="desc">Ablauf: DHCP-Discover, Offer mit Option 42, Request, Ack, danach NTP-Anfrage an ntp-gui.</desc><defs><marker id="arr-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#59636e"/></marker><marker id="arr-ntp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0969da"/></marker><marker id="arr-gps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#bc4c00"/></marker><marker id="arr-ptp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8250df"/></marker><marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0969da"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#818b98"/></marker><marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#1a7f37"/></marker></defs><rect x="1" y="1" width="1198" height="468" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="85" y="26" width="210" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="85" y="26" width="210" height="5" rx="2" fill="#818b98"/><text x="190" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">Client</text><text x="190" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">PC, IoT, …</text><path d="M190,92 L190,446" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="495" y="26" width="210" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="495" y="26" width="210" height="5" rx="2" fill="#0969da"/><text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">DHCP-Server</text><text x="600" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Router / Firewall</text><path d="M600,92 L600,446" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><rect x="905" y="26" width="210" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="905" y="26" width="210" height="5" rx="2" fill="#1a7f37"/><text x="1010" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">ntp-gui</text><text x="1010" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">192.168.1.10</text><path d="M1010,92 L1010,446" fill="none" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><path d="M190,130 L594,130" fill="none" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr-ink2)"/><text x="395.0" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#59636e" text-anchor="middle">DHCPDISCOVER (Broadcast)</text><rect x="202" y="160" width="386" height="42" rx="8" fill="#ddf4ff"/><path d="M600,190 L196,190" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-accent)"/><text x="395.0" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">DHCPOFFER · Option 42: 192.168.1.10</text><path d="M190,250 L594,250" fill="none" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr-ink2)"/><text x="395.0" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#59636e" text-anchor="middle">DHCPREQUEST</text><rect x="202" y="280" width="386" height="42" rx="8" fill="#ddf4ff"/><path d="M600,310 L196,310" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-accent)"/><text x="395.0" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">DHCPACK · Option 42: 192.168.1.10</text><path d="M190,375 L1004,375" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-ntp)"/><text x="600.0" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#59636e" text-anchor="middle">NTP-Anfrage · UDP 123</text><path d="M1010,425 L196,425" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-good)"/><text x="600.0" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#59636e" text-anchor="middle">Zeit · Stratum 1</text><circle cx="52" cy="125" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">1</text><circle cx="52" cy="185" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">2</text><circle cx="52" cy="245" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">3</text><circle cx="52" cy="305" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">4</text><circle cx="52" cy="370" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">5</text><circle cx="52" cy="420" r="13" fill="#ffffff" stroke="#d0d7de"/><text x="52" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#59636e" text-anchor="middle">6</text></svg>
