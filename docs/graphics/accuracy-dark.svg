<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Typische Genauigkeit je Zeitquelle</title><desc id="desc">Logarithmische Skala von 10 Nanosekunden bis 100 Millisekunden. Internet-NTP 1 bis 50 ms, USB-GPS ohne PPS 1 bis 10 ms, GPS mit PPS 0,1 bis 1 µs, PTP mit Hardware-Zeitstempeln 20 ns bis 1 µs.</desc><defs><marker id="arr-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#9198a1"/></marker><marker id="arr-ntp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#4493f8"/></marker><marker id="arr-gps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#f0883e"/></marker><marker id="arr-ptp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ab7df8"/></marker><marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#4493f8"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7d8590"/></marker><marker id="arr-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#3fb950"/></marker></defs><rect x="1" y="1" width="1198" height="428" rx="18" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7d8590" text-anchor="start">Abweichung zur echten Zeit, logarithmisch</text><line x1="380.0" y1="78" x2="380.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="380.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">10 ns</text><line x1="490.0" y1="78" x2="490.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="490.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">100 ns</text><line x1="600.0" y1="78" x2="600.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="600.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">1 µs</text><line x1="710.0" y1="78" x2="710.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="710.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">10 µs</text><line x1="820.0" y1="78" x2="820.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="820.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">100 µs</text><line x1="930.0" y1="78" x2="930.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="930.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">1 ms</text><line x1="1040.0" y1="78" x2="1040.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="1040.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">10 ms</text><line x1="1150.0" y1="78" x2="1150.0" y2="362" stroke="#262c36" stroke-width="1"/><text x="1150.0" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7d8590" text-anchor="middle">100 ms</text><text x="40" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start">Internet-NTP</text><text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Pool, über das Internet</text><rect x="930.0" y="103" width="186.88670047696223" height="18" rx="9" fill="#4493f8"/><text x="1128.8867004769622" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">1–50 ms</text><text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start">USB-GPS ohne PPS</text><text x="40" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">z. B. VK-162, kalibriert</text><rect x="930.0" y="169" width="110.0" height="18" rx="9" fill="#f0883e"/><text x="1052.0" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">1–10 ms</text><text x="40" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start">GPS mit PPS</text><text x="40" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">HAT / GPIO, /dev/pps0</text><rect x="490.0" y="235" width="110.0" height="18" rx="9" fill="#f0883e"/><text x="612.0" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">0,1–1 µs</text><text x="40" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="start">PTP mit HW-Zeitstempeln</text><text x="40" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">IEEE 1588 im LAN</text><rect x="413.11329952303794" y="301" width="186.88670047696206" height="18" rx="9" fill="#ab7df8"/><text x="612.0" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">20 ns–1 µs</text></svg>
